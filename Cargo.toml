[package]
name = "rustos-bootloader"
version = "0.1.0"
edition = "2021"
description = "UEFI/BIOS bootloader tooling for RustOS: validates a kernel ELF and builds a bootable GPT (UEFI) or MBR (BIOS) disk image around it."
license = "MIT OR Apache-2.0"

[[bin]]
name = "rustos-bootloader"
path = "src/main.rs"

[lib]
name = "rustos_bootloader"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
# Vendored `bootloader` 0.11.17 (see vendor/bootloader) instead of the
# crates.io crate. The code is unmodified upstream 0.11.17; the only
# change is a `[patch.crates-io]` in its workspace root that points
# `uefi` at the vendored, patched copy in vendor/uefi (see the
# "Vendored uefi patch" section in the README). The patch section has
# to live there because the bootloader's build script builds its UEFI
# binary with a separate nested `cargo install --path uefi`, which a
# [patch] in this manifest cannot reach.
bootloader = { path = "vendor/bootloader" }

[profile.release]
debug = false
